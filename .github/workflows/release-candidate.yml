name: Windows release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Run release verification
        run: npm run test:release

      - name: Upload unsigned beta installer
        uses: actions/upload-artifact@v4
        with:
          name: pulse-dashboard-windows-x64-unsigned
          if-no-files-found: error
          path: |
            release/Pulse-Dashboard-Setup-*-x64.exe
            release/Pulse-Dashboard-Setup-*-x64.exe.blockmap
          retention-days: 14
