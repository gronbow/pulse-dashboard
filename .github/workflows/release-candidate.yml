name: Windows release candidate

on:
  workflow_dispatch:

concurrency:
  group: windows-release-candidate
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run pre-build release verification
        run: npm run test:ci

      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged application
        run: npm run test:packaged

      - name: Generate SPDX SBOM from packaged application
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: release/win-unpacked
          format: spdx-json
          output-file: release/pulse-dashboard-windows-x64.spdx.json
          upload-artifact: false

      - name: Generate SHA-256 checksums
        run: npm run release:checksums

      - name: Attest Windows installer provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/Pulse-Dashboard-Setup-*-x64.exe

      - name: Attest Windows installer SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/Pulse-Dashboard-Setup-*-x64.exe
          sbom-path: release/pulse-dashboard-windows-x64.spdx.json

      - name: Upload unsigned beta installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulse-dashboard-windows-x64-unsigned
          if-no-files-found: error
          path: |
            release/Pulse-Dashboard-Setup-*-x64.exe
            release/Pulse-Dashboard-Setup-*-x64.exe.blockmap
            release/pulse-dashboard-windows-x64.spdx.json
            release/SHA256SUMS.txt
          retention-days: 14
