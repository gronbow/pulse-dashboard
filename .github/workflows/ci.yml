name: Quality checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run privacy and data-chain tests
        run: npm test

      - name: Audit reachable Git history
        run: npm run audit:history

      - name: Audit complete dependency graph
        run: npm run audit:dependencies

      - name: Audit packaged runtime dependencies
        run: npm run audit:production
